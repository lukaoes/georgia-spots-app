    <!--
      These OG/Twitter tags are what social-media link-preview scrapers (Facebook, X/Twitter,
      WhatsApp, Slack, etc.) and any crawler that doesn't execute JavaScript actually see - they
      read the raw HTML response, not the per-page tags react-helmet-async sets after JS runs.
      Google's own crawler does render JS and picks up the per-page versions from each page
      component instead. Keep these accurate as a sensible default for the homepage/shares of
      pages a bot can't render.
    -->
    <meta property="og:site_name" content="Vanlife.Ge" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Vanlife.Ge — ბანაკები და სადგომები საქართველოში" />

    <meta name="twitter:card" content="summary_large_image" />
